exclude: ^(data/|db/|docs/)

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: pylint
        name: Pylint backend
        entry: python -m pylint backend
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        types: [javascript]
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: npx --no-install prettier --write
        language: system
        files: ^(public/assets/js/.*\.js|tests/.*\.mjs|eslint\.config\.js|[^/]+\.(json|yaml)|\.pre-commit-config\.yaml|\.github/workflows/.*\.yml)$
      - id: check-yaml
        name: Check YAML
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: Check TOML
        entry: check-toml
        language: system
        types: [toml]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Fix final newline
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^ci\.yaml$
