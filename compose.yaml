services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - kahoo-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      KAHOO_HOST: ${KAHOO_HOST:?}
      KAHOO_PORT: ${KAHOO_PORT:?}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:?}
      META_IG_USER_ID: ${META_IG_USER_ID?}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN?}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID?}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET?}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:?}
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: ${INSTAGRAM_TOKEN_ENCRYPTION_KEY?}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL?}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?}
      RERANK_API_URL: ${RERANK_API_URL?}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:?}
      KAHOO_ADMIN_TOKEN: ${KAHOO_ADMIN_TOKEN?}
      PRODUCT_VISION_API_URL: ${PRODUCT_VISION_API_URL?}
      PRODUCT_VISION_API_KEY: ${PRODUCT_VISION_API_KEY?}
      PRODUCT_VISION_MODEL: ${PRODUCT_VISION_MODEL?}
      PRODUCT_VISION_TIMEOUT: ${PRODUCT_VISION_TIMEOUT:?}
      PRODUCT_VISION_MAX_IMAGES: ${PRODUCT_VISION_MAX_IMAGES:?}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KAHOO_PORT:?}:${KAHOO_PORT:?}"

volumes:
  kahoo-postgres:
