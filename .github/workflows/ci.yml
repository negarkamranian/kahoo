name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: kahoo_test
          POSTGRES_USER: kahoo
          POSTGRES_PASSWORD: kahoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kahoo -d kahoo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      KAHOO_TEST_DATABASE_URL: postgresql://kahoo:kahoo_test@127.0.0.1:5432/kahoo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: make check PYTHON=python
      - run: pre-commit run --all-files
